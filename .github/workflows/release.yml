name: Release

# Manuell ausloesbarer Release: erzeugt Tag und GitHub-Release. Die Version wird
# aus dem hoechsten vX.Y.Z-Tag und der gewaehlten Stufe (patch/minor/major)
# berechnet. Der Text der Release-Notes wird aus den Conventional Commits seit
# dem letzten v*-Tag generiert (siehe tooling/release-notes.sh, laesst sich auch
# lokal aufrufen).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Neue Version: patch (5.1.2 -> 5.1.3), minor (-> 5.2.0) oder major (-> 6.0.0)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Version berechnen
      id: version
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
        IFS=. read -r major minor patch <<< "${latest#v}"
        major="${major:-0}" minor="${minor:-0}" patch="${patch:-0}"
        case "$BUMP" in
          major) version="$((major + 1)).0.0" ;;
          minor) version="$major.$((minor + 1)).0" ;;
          patch) version="$major.$minor.$((patch + 1))" ;;
          *) echo "::error::Unbekannte Stufe '$BUMP'."; exit 1 ;;
        esac
        tag="v$version"
        echo "Letzte Version: ${latest:-keine}, neue Version: $tag ($BUMP)"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "::error::Tag $tag existiert bereits."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Release-Notes erzeugen
      id: notes
      run: |
        previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
        echo "previous=$previous" >> "$GITHUB_OUTPUT"

        tooling/release-notes.sh "$previous" HEAD > release-notes.md

        if [ -n "$previous" ]; then
          {
            echo
            echo "**Vollständiger Vergleich**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
          } >> release-notes.md
        fi

        {
          echo "## Release-Notes für ${TAG}"
          echo
          echo "Basis: ${previous:-erster Commit}"
          echo
          cat release-notes.md
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        TAG: ${{ steps.version.outputs.tag }}

    - name: Tag erstellen und pushen
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"

    - name: GitHub-Release erstellen
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
      run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
